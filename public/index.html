<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divine Dada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: the home screen is a small solar system. Each planet is a section of the portfolio; tapping one
   launches a rocket, and landing opens a scene with its own palette, constellation and atmosphere. Single dark theme. */
:root {
  --bg: #070b14;
  --ink: #e8eef7;
  --muted: #8e9bb3;
  --teal: #2dd4bf;
  --purple: #a78bfa;
  --a: var(--teal);
  --b: var(--purple);
  --line: rgba(255, 255, 255, 0.09);
  --display: "Sora", system-ui, sans-serif;
  --body: "Manrope", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; background: var(--bg); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background-color: var(--bg);
  background-image:
    radial-gradient(900px 520px at 88% -4%, rgba(124, 92, 246, 0.22), transparent 62%),
    radial-gradient(800px 520px at -4% 18%, rgba(20, 184, 166, 0.16), transparent 62%);
  background-attachment: fixed;
  color: var(--ink); font: 400 16px/1.65 var(--body);
}
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
main, header.nav, footer { position: relative; z-index: 1; }
a { color: inherit; }
button { font-family: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--a); outline-offset: 3px; border-radius: 8px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-family: var(--display); }
p { margin: 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
.grad-text { background: linear-gradient(100deg, var(--a), var(--b)); -webkit-background-clip: text; background-clip: text; color: transparent; }

.glass {
  position: relative; border-radius: 20px; background: rgba(255, 255, 255, 0.04);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.glass::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(140deg, color-mix(in srgb, var(--a) 55%, transparent), rgba(255, 255, 255, 0.07) 42%, color-mix(in srgb, var(--b) 55%, transparent));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(280px circle at var(--mx, 50%) var(--my, -50%), color-mix(in srgb, var(--a) 14%, transparent), transparent 70%);
  opacity: 0; transition: opacity 0.25s;
}
.glass:hover::before { opacity: 1; }

/* nav */
header.nav { position: sticky; top: 12px; z-index: 20; padding: 0 12px; }
.pill {
  max-width: 820px; margin: 12px auto 0; display: flex; align-items: center; gap: 8px;
  padding: 8px 8px 8px 18px; border-radius: 999px; background: rgba(10, 16, 28, 0.7); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
.mark { font: 500 13px var(--mono); text-decoration: none; margin-right: auto; white-space: nowrap; color: var(--muted); }
.mark b { font-weight: 500; color: var(--teal); }
nav.main { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.main::-webkit-scrollbar { display: none; }
nav.main a { font: 500 13px var(--body); text-decoration: none; color: var(--muted); padding: 7px 13px; border-radius: 999px; white-space: nowrap; transition: color 0.2s, background 0.2s; }
nav.main a:hover { color: var(--ink); background: rgba(255, 255, 255, 0.07); }

/* hero */
.welcome { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 34px 0 0; font: 600 13px var(--mono); letter-spacing: 0.32em; text-transform: uppercase; }
.welcome::before, .welcome::after { content: ""; height: 1px; width: min(18vw, 140px); background: linear-gradient(90deg, transparent, var(--teal, #2dd4bf)); }
.welcome::after { transform: scaleX(-1); }
.welcome span { background: linear-gradient(90deg, var(--teal, #2dd4bf), var(--purple, #a78bfa)); -webkit-background-clip: text; background-clip: text; color: transparent; }
@keyframes welcomeIn { from { opacity: 0; letter-spacing: 0.5em; } to { opacity: 1; letter-spacing: 0.32em; } }
@media (prefers-reduced-motion: no-preference) { .welcome { animation: welcomeIn 1.1s ease-out both; } }
@media (max-width: 560px) { .welcome { font-size: 11px; letter-spacing: 0.22em; gap: 12px; margin-top: 24px; } @keyframes welcomeIn { from { opacity: 0; } to { opacity: 1; } } }
.hero { padding: 40px 0 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font: 500 12px var(--mono); color: var(--teal); background: rgba(45, 212, 191, 0.08); border: 1px solid rgba(45, 212, 191, 0.25); }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 10px var(--teal); }
.hero h1 { font-weight: 700; font-size: clamp(42px, 7vw, 72px); line-height: 1.02; letter-spacing: -0.025em; margin: 20px 0 22px; }
.lede { max-width: 50ch; font-size: 18px; color: #c6d0e0; }
.lede + .lede { margin-top: 12px; font-size: 16px; color: var(--muted); }
.cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }
.btn { display: inline-block; font: 600 14px var(--body); text-decoration: none; padding: 12px 22px; border-radius: 999px; cursor: pointer; color: var(--ink); background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; }
.btn:hover { border-color: color-mix(in srgb, var(--a) 70%, transparent); transform: translateY(-1px); }
.btn.solid { color: #06101a; background: linear-gradient(100deg, var(--a), var(--b)); border-color: transparent; }
.btn.solid:hover { box-shadow: 0 8px 28px rgba(45, 212, 191, 0.25), 0 8px 28px rgba(167, 139, 250, 0.2); }

.system { position: relative; }
#sys { width: 100%; aspect-ratio: 1.1 / 1; display: block; touch-action: manipulation; }
/* planet buttons stay in the page for keyboard and screen-reader users, and show only when focused */
.mc:not(:focus-within) { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.hint { text-align: center; font: 400 12px var(--mono); color: var(--muted); margin-top: 4px; }
.mc { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
.mc button { display: inline-flex; align-items: center; gap: 8px; font: 500 13px var(--body); color: var(--ink); padding: 8px 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); cursor: pointer; transition: border-color 0.2s, transform 0.2s; }
.mc button:hover { transform: translateY(-1px); border-color: rgba(255, 255, 255, 0.3); }
.mc i, .travel-btn i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px currentColor; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; padding: 24px 0 8px; }
.fact { padding: 14px 18px; border-radius: 16px; }
.fact small { display: block; font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.fact span { display: block; margin-top: 2px; font-weight: 500; overflow-wrap: anywhere; }

section.home-sec { padding: 72px 0 8px; }
.sec-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 26px; }
.sec-head .num { font: 500 13px var(--mono); color: var(--a); }
.sec-head h2 { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; }
.sec-head .note { margin-left: auto; font: 400 12px var(--mono); color: var(--muted); }

/* now panel */
.now { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.card { padding: 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.label { display: flex; align-items: center; gap: 8px; font: 500 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.label .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--b); }
.label .dot.games { background: var(--a); }
.listen-when { font: 400 12px var(--mono); color: var(--a); margin-top: 2px; }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--a); box-shadow: 0 0 10px var(--a); display: none; }
.live.on { display: inline-block; }
.cur { display: flex; gap: 14px; align-items: center; }
.art { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; flex: none; }
.cur .t { font: 600 22px/1.2 var(--display); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.cur .s { color: var(--muted); font-size: 14px; margin-top: 2px; }
.cur a.open { display: inline-block; margin-top: 8px; font: 500 12px var(--mono); color: var(--a); text-decoration: none; }
.cur a.open:hover { text-decoration: underline; }
.meter { height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--a), var(--b)); }
.meter-cap { display: flex; justify-content: space-between; font: 400 11px var(--mono); color: var(--muted); margin-top: 6px; }
.recent { list-style: none; margin: auto 0 0; padding: 14px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.recent li { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.recent li span:last-child { color: var(--muted); font: 400 12px var(--mono); text-align: right; }
.st { padding: 2px 10px; border-radius: 999px; font: 500 11px var(--mono); border: 1px solid var(--line); }
.st.finished { color: var(--purple); border-color: rgba(167, 139, 250, 0.4); }
.st.playing { color: var(--teal); border-color: rgba(45, 212, 191, 0.4); }
.st.dropped, .st.backlog, .st.played { color: var(--muted); }
.st.live { color: #fb923c; border-color: rgba(251, 146, 60, 0.4); }
.gstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.gstat { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); }
.gk { display: block; font: 400 10px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.gv { display: block; margin-top: 4px; font: 600 15px var(--sans, inherit); }
.embed { width: 100%; height: 152px; border: 0; border-radius: 12px; }

footer { margin-top: 72px; padding: 22px 0 44px; border-top: 1px solid var(--line); font: 400 12px var(--mono); color: var(--muted); }
footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ---------- planet scenes ---------- */
.scene { position: fixed; inset: 0; z-index: 40; overflow: hidden; color: var(--ink); }
.scene[hidden] { display: none; }
.scene-bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene-scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 120px; }
.scene-top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: linear-gradient(rgba(5, 8, 14, 0.65), transparent); }
.scene-top .btn { padding: 9px 18px; font-size: 13px; white-space: nowrap; flex: none; }
.travel { display: flex; gap: 6px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.travel::-webkit-scrollbar { display: none; }
.travel-btn { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; font: 500 13px var(--body); color: var(--muted); background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.travel-btn:hover { color: var(--ink); border-color: rgba(255, 255, 255, 0.3); }
.scene-title { padding: 40px 0 8px; }
.scene-title .eyebrow { font: 500 12px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--a); }
.scene-title h2 { font-size: clamp(40px, 7vw, 68px); font-weight: 700; letter-spacing: -0.025em; line-height: 1.05; margin: 10px 0 12px; }
.scene-title p { color: #c6d0e0; max-width: 54ch; font-size: 17px; }

.star { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 14px; }
.star .dot { position: relative; width: 14px; height: 14px; border-radius: 50%; background: var(--a); box-shadow: 0 0 16px var(--a); transition: transform 0.2s, box-shadow 0.2s; }
.star .dot::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1px solid var(--a); opacity: 0; animation: ping 2.6s ease-out infinite; animation-delay: var(--d, 0s); }
@keyframes ping { 0% { transform: scale(0.6); opacity: 0.75; } 100% { transform: scale(2); opacity: 0; } }
.star.on .dot::after { animation: none; }
@media (prefers-reduced-motion: reduce) { .star .dot::after { animation: none; opacity: 0.4; } }
.nav { position: relative; margin: 20px 0 8px; }
.nav-records, .nav-masts { aspect-ratio: 2.4 / 1; min-height: 290px; }
.nav .lbl { font: 500 12px var(--mono); white-space: nowrap; color: #c6d0e0; }
/* games: arcade high-score board */
.nav-scores { flex: none; width: min(100%, 880px); margin: 22px 0 8px; padding: 18px 18px 14px; border-radius: 18px; border: 1px solid color-mix(in srgb, var(--a) 35%, transparent); background: linear-gradient(180deg, rgba(8, 4, 24, 0.82), rgba(14, 6, 34, 0.7)); box-shadow: 0 0 40px color-mix(in srgb, var(--a) 14%, transparent), inset 0 0 60px rgba(0, 0, 0, 0.35); backdrop-filter: blur(10px); }
.sc-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; font: 700 13px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--a); text-shadow: 0 0 12px var(--a); }
.sc-title span:last-child { color: var(--muted); font-weight: 400; letter-spacing: 0.04em; text-transform: none; text-shadow: none; font-size: 11px; }
.sc-ctl { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between; margin-bottom: 12px; }
.sc-grp { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); color: var(--muted); font: 500 12px var(--mono); cursor: pointer; }
.fchip:hover { color: #fff; }
.fchip[aria-pressed="true"] { color: #fff; border-color: var(--a); background: color-mix(in srgb, var(--a) 18%, transparent); }
.sc-body { display: flex; flex-direction: column; gap: 5px; }
.sc-row { --rc: #a78bfa; display: grid; grid-template-columns: 34px minmax(230px, 2fr) minmax(50px, 1.2fr) 82px 96px 92px; align-items: center; gap: 12px; padding: 9px 12px 9px 10px; text-align: left; color: #fff; font: 500 13px var(--mono); border: 0; border-left: 3px solid var(--rc); border-radius: 8px; background: rgba(255, 255, 255, 0.035); cursor: pointer; transition: background 0.15s, transform 0.15s; }
.sc-row:hover { background: color-mix(in srgb, var(--rc) 16%, rgba(255, 255, 255, 0.03)); transform: translateX(3px); }
.sc-row.on { outline: 1px solid #fff; background: color-mix(in srgb, var(--rc) 22%, transparent); }
.sc-row.gone { display: none; }
.sc-hi { --rc: #ffd24a; } .sc-mid { --rc: #7dd3fc; } .sc-low { --rc: #8b7bd6; } .sc-none { --rc: #6b7280; }
.sc-finished { --rc: #22d3ee; } .sc-live { --rc: #fb923c; } .sc-playing { --rc: #a3e635; } .sc-played { --rc: #8b7bd6; }
.sc-rank { color: var(--muted); font-size: 12px; }
.sc-fav { margin-right: 8px; padding: 1px 6px; border-radius: 99px; font: 700 10px var(--mono); color: #1a1000; background: #ffd24a; box-shadow: 0 0 10px rgba(255, 210, 74, 0.55); }
.sc-name { font: 600 14px var(--sans, inherit); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-bar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
.sc-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--rc), color-mix(in srgb, var(--rc) 40%, #fff)); box-shadow: 0 0 10px var(--rc); }
.sc-hrs { text-align: right; color: var(--rc); font-weight: 700; text-shadow: 0 0 10px color-mix(in srgb, var(--rc) 70%, transparent); }
.sc-st { font-size: 10px; letter-spacing: 0.08em; color: var(--rc); }
.sc-lp { text-align: right; font-size: 11px; color: var(--muted); }
@media (max-width: 640px) {
  .nav-scores { padding: 14px 10px 10px; }
  .sc-row { grid-template-columns: 26px 1fr auto; grid-template-areas: "r n h" "r b b" "r s l"; gap: 4px 10px; }
  .sc-rank { grid-area: r; align-self: start; padding-top: 3px; } .sc-name { grid-area: n; } .sc-hrs { grid-area: h; } .sc-bar { grid-area: b; } .sc-st { grid-area: s; } .sc-lp { grid-area: l; }
}
/* music: vinyl records */
.rec { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 12px; background: none; border: 0; padding: 12px; cursor: pointer; }
.disc { position: relative; width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; background: repeating-radial-gradient(circle at 50% 50%, #08110c 0 2px, #14231a 2px 3px); box-shadow: 0 0 26px color-mix(in srgb, var(--a) 28%, transparent), inset 0 0 0 2px rgba(255, 255, 255, 0.07); }
.disc::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 25deg, transparent 0 18%, rgba(255, 255, 255, 0.16) 24%, transparent 30% 68%, rgba(255, 255, 255, 0.1) 74%, transparent 80%); }
.disc-label { position: relative; width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--a), var(--b)); }
.disc-label::after { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: #06110b; }
@keyframes spin { to { transform: rotate(360deg); } }
.rec.spin .disc { animation: spin 5s linear infinite; }
.rec:hover .disc { animation: spin 2.2s linear infinite; }
.rec.on .disc { outline: 3px solid color-mix(in srgb, var(--a) 50%, transparent); outline-offset: 5px; }
@media (prefers-reduced-motion: reduce) { .rec .disc, .rec:hover .disc, .rec.spin .disc { animation: none; } }
/* shows: film strip */
.nav-film { display: flex; justify-content: center; padding-top: 14px; }
.strip { position: relative; display: flex; justify-content: center; gap: 14px; width: min(100%, 720px); padding: 40px 24px; background: #05101a; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--a) 30%, transparent); box-shadow: 0 0 40px color-mix(in srgb, var(--a) 14%, transparent); }
.strip::before, .strip::after { content: ""; position: absolute; left: 12px; right: 12px; height: 10px; border-radius: 2px; background: repeating-linear-gradient(90deg, rgba(220, 240, 255, 0.5) 0 9px, transparent 9px 21px); }
.strip::before { top: 14px; }
.strip::after { bottom: 14px; }
.frame { position: relative; flex: 1 1 0; max-width: 200px; min-width: 0; aspect-ratio: 4 / 3; display: grid; place-items: center; text-align: center; padding: 10px; border: 2px solid rgba(220, 240, 255, 0.25); border-radius: 6px; cursor: pointer; color: var(--ink); background: linear-gradient(160deg, color-mix(in srgb, var(--a) 30%, #05101a), color-mix(in srgb, var(--b) 18%, #05101a)); transition: transform 0.2s, border-color 0.2s; }
.frame:hover { transform: translateY(-4px); border-color: var(--a); }
.frame.on { border-color: #fff; }
.frame-t { font: 600 17px/1.2 var(--display); overflow-wrap: anywhere; }
.frame-tag { position: absolute; top: 6px; left: 8px; font: 500 10px var(--mono); letter-spacing: 0.12em; color: var(--a); }
/* books: shelf */
.nav-shelf { padding-top: 10px; overflow: hidden; }
.books { display: flex; align-items: flex-end; justify-content: center; gap: 5px; padding: 30px 12px 0; }
.book { position: relative; flex: none; border: 0; padding: 0; border-radius: 3px 3px 1px 1px; background: linear-gradient(90deg, rgba(0, 0, 0, 0.3), transparent 20%, transparent 80%, rgba(0, 0, 0, 0.28)), var(--bk, #6d5bd0); box-shadow: inset 0 14px 0 -10px rgba(255, 255, 255, 0.28), inset 0 -14px 0 -10px rgba(255, 255, 255, 0.2); transition: transform 0.25s; transform-origin: bottom center; }
button.book { cursor: pointer; }
.book.ghost { opacity: 0.35; }
button.book:hover { transform: translateY(-14px) rotate(-2deg); }
.book.pulled { transform: translateY(-16px) rotate(-3deg); }
.book.pulled:hover { transform: translateY(-22px) rotate(-3deg); }
.book.on { outline: 2px solid #fff; outline-offset: 3px; }
.spine { position: absolute; inset: 20px 0; display: block; writing-mode: vertical-rl; transform: rotate(180deg); line-height: 58px; text-align: center; font: 600 13px/58px var(--display); color: rgba(255, 255, 255, 0.92); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plank { height: 14px; border-radius: 3px; background: linear-gradient(#3a2d6b, #1a1240); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 24px color-mix(in srgb, var(--a) 15%, transparent); }
@media (prefers-reduced-motion: reduce) { .book { transition: none; } }
/* portfolio: gear train */
.nav-gears { container-type: inline-size; --maxh: 430px; width: min(100%, calc(var(--maxh) * var(--ar))); aspect-ratio: var(--ar); margin: 24px auto 8px; }
.nav-gears svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--a) 35%, transparent)); }

}
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---- live listening: polls Last.fm (or Spotify, once linked), shows a running timer and a live "Updated" stamp ---- */
const LISTEN = { since: 0, at: null, live: false, stamp: 0 };
const fmtStamp = ms => {
  try { return new Intl.DateTimeFormat("en-CA", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit", timeZone: DATA.tz, timeZoneName: "short" }).format(new Date(ms)); }
  catch (e) { return new Date(ms).toLocaleString(); }
};
const fmtAgo = ms => {
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 45) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " days ago";
};
function tickListen() {
  const w = $("listen-when");
  if (!w || !LISTEN.since) return;
  if (LISTEN.live) {
    const s = Math.floor((Date.now() - LISTEN.since) / 1000), m = Math.floor(s / 60);
    w.textContent = "Listening for " + m + ":" + String(s % 60).padStart(2, "0");
  } else w.textContent = LISTEN.at ? "Played " + fmtAgo(Date.now() - LISTEN.at) : "Last played";
}
setInterval(tickListen, 1000);

/* Shows a track in the Listening card and the Music scene. t: { title, artist, art, url }, recent: same shape.
   at: when the track was played (ms), or null when it is playing right now. */
function showListening(t, recent, live, linkText, at) {
  const sig = t.title + "|" + t.artist;
  if (sig !== LISTEN.sig) {                       /* a new song: restart the timer and refresh the Updated stamp */
    LISTEN.sig = sig; LISTEN.since = live ? Date.now() : (at || Date.now());
    LISTEN.stamp = live ? Date.now() : (at || Date.now());
    $("updated").textContent = "Updated " + fmtStamp(LISTEN.stamp);
  } else if (live && !LISTEN.live) { LISTEN.since = Date.now(); LISTEN.stamp = Date.now(); $("updated").textContent = "Updated " + fmtStamp(LISTEN.stamp); }
  LISTEN.live = !!live; LISTEN.at = at || null;
  const cur = $("cur-listening");
  cur.innerHTML = "";
  if (t.art) {
    const a = el("img", { class: "art", src: t.art, alt: "", loading: "lazy" });
    a.addEventListener("error", () => a.remove());
    cur.append(a);
  }
  cur.append(el("div", {}, [
    el("div", { class: "t", text: t.title }), el("div", { class: "s", text: t.artist }),
    el("div", { class: "s listen-when", id: "listen-when", "aria-live": "off" }),
    el("a", { class: "open", target: "_blank", rel: "noopener", text: linkText || "Find on Spotify",
      href: t.url || "https://open.spotify.com/search/" + encodeURIComponent(t.title + " " + t.artist) })
  ]));
  tickListen();
  $("live-listening").classList.toggle("on", !!live);
  const rec = $("recent-listening"); rec.innerHTML = "";
  recent.forEach(x => rec.append(el("li", {}, [el("span", { text: x.title }), el("span", { text: x.artist })])));
  const sig2 = t.title + "|" + t.artist + "|" + recent.map(x => x.title).join("|");
  if (sig2 === showListening.last) return;
  showListening.last = sig2;
  DATA.now.listening.current = { title: t.title, sub: t.artist };
  DATA.now.listening.recent = recent.map(x => [x.title, x.artist]);
  rebuildScene("music");
}

async function loadLastfm() {
  /* Prefer the site's own /api/lastfm/now (no CORS or blocker problems, key stays on the server). */
  try {
    const res = await fetch("/api/lastfm/now", { headers: { accept: "application/json" } });
    const d = res.ok ? await res.json() : null;
    if (d && d.linked && d.track) { showListening(d.track, d.recent || [], d.playing, "Find on Spotify", d.at || null); return true; }
  } catch (e) { /* no backend: try Last.fm directly */ }
  const c = DATA.lastfm;
  if (!c || !c.user || !c.key) return false;
  try {
    const res = await fetch("https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&format=json&limit=5" +
      "&user=" + encodeURIComponent(c.user) + "&api_key=" + encodeURIComponent(c.key));
    const data = await res.json();
    if (data.error) { console.warn("Last.fm:", data.error, data.message); return false; }
    const tracks = data.recenttracks.track;
    if (!tracks || !tracks.length) { console.warn("Last.fm: no scrobbles yet"); return false; }
    const pick = x => ({ title: x.name, artist: x.artist["#text"], art: ((x.image || []).find(i => i.size === "large") || {})["#text"] || "" });
    const t = tracks[0], live = !!(t["@attr"] && t["@attr"].nowplaying === "true");
    const at = !live && t.date ? Number(t.date.uts) * 1000 : null;
    showListening(pick(t), tracks.slice(1, 4).map(pick), live, "Find on Spotify", at);
    return true;
  } catch (e) { console.warn("Last.fm failed:", e); return false; }
}

  } catch (e) { /* not linked or offline */ }
  spotifyOk = false;
  return false;
}

function drawRocket(c, x, y, ang, sc, flame) {

  if (flame > 0) {
    const f = flame * (14 + Math.random() * 6), g = c.createLinearGradient(0, 8, 0, 8 + f);
    g.addColorStop(0, "rgba(255,230,150,.95)"); g.addColorStop(0.5, "rgba(255,125,60,.7)"); g.addColorStop(1, "rgba(255,80,60,0)");
    c.fillStyle = g; c.beginPath(); c.moveTo(-3.5, 8); c.quadraticCurveTo(0, 8 + f * 1.1, 3.5, 8); c.closePath(); c.fill();
  }
  c.fillStyle = "#8b6cf0";
  c.beginPath(); c.moveTo(-6, 1); c.lineTo(-12, 12); c.lineTo(-6, 9); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(6, 1); c.lineTo(12, 12); c.lineTo(6, 9); c.closePath(); c.fill();
  const g2 = c.createLinearGradient(-7, 0, 7, 0);
  g2.addColorStop(0, "#9fb0cc"); g2.addColorStop(0.45, "#f4f8ff"); g2.addColorStop(1, "#a9b8d3");
  c.fillStyle = g2; c.beginPath(); c.moveTo(0, -15); c.quadraticCurveTo(8, -6, 7, 9); c.lineTo(-7, 9); c.quadraticCurveTo(-8, -6, 0, -15); c.closePath(); c.fill();
  c.fillStyle = "#2dd4bf"; c.beginPath(); c.arc(0, -3, 3, 0, 7); c.fill();
  c.strokeStyle = "#0b1220"; c.lineWidth = 1; c.stroke();
  c.restore();
}

function drawScene(S, now) {

const maxR = (x, y) => Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));

function openScene(id, ox, oy, instant) {

  busy = true; S.origin = { x: ox, y: oy }; S.trigger = lastTrigger;
  cur = id;

const bc = $("bg"), bx = bc.getContext("2d");
